<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Aquib Rashid Shaikh | Senior Android Lead</title>
    <script type="text/javascript">
      // GitHub Pages Single Page App Redirect
      // Encodes pathname & query to redirect back to index.html with ?p=
      var pathSegmentsToKeep = 1; // 1 if hosted under /Portfolio, 0 if custom domain
      var l = window.location;
      var path = l.pathname;
      if (path.startsWith('/Portfolio/')) {
        path = path.substring(10);
      }
      var targetUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        (l.pathname.startsWith('/Portfolio') ? '/Portfolio' : '') +
        '/?p=' + encodeURIComponent(path + l.search) + l.hash;
      l.replace(targetUrl);
    </script>
  </head>
  <body>
    <p>Redirecting to case study...</p>
  </body>
</html>
